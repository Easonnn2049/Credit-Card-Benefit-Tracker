name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_URL: ${{ vars.STREAMLIT_APP_URL || secrets.STREAMLIT_APP_URL || secrets.ALERT_APP_URL }}
      READY_TEXT: ${{ vars.STREAMLIT_READY_TEXT || 'Credit Card Benefit Tracker' }}

    steps:
      - name: Validate app URL
        shell: bash
        run: |
          if [[ -z "${APP_URL}" ]]; then
            echo "Set repository variable STREAMLIT_APP_URL or secret STREAMLIT_APP_URL / ALERT_APP_URL to your Streamlit app URL."
            exit 1
          fi

          clean_url="${APP_URL//$'\r'/}"
          clean_url="${clean_url//$'\n'/}"
          clean_url="${clean_url#"${clean_url%%[![:space:]]*}"}"
          clean_url="${clean_url%"${clean_url##*[![:space:]]}"}"
          clean_url="${clean_url#\"}"
          clean_url="${clean_url%\"}"
          clean_url="${clean_url#\'}"
          clean_url="${clean_url%\'}"

          if [[ "${clean_url}" == https://* ]]; then
            scheme="https"
            host_and_path="${clean_url#https://}"
          elif [[ "${clean_url}" == http://* ]]; then
            scheme="http"
            host_and_path="${clean_url#http://}"
          else
            echo "APP_URL must start with http:// or https://."
            exit 1
          fi

          host_and_path="${host_and_path%%\?*}"
          host_and_path="${host_and_path%%#*}"
          host="${host_and_path%%/*}"

          if [[ -z "${host}" ]]; then
            echo "APP_URL must include a host."
            exit 1
          fi

          normalized_url="${scheme}://${host}"
          echo "APP_URL=${normalized_url}" >> "${GITHUB_ENV}"
          echo "HEALTH_URL=${normalized_url}/_stcore/health" >> "${GITHUB_ENV}"
          echo "Using Streamlit host: ${normalized_url}"

      - name: Ping Streamlit endpoints
        shell: bash
        run: |
          echo "Pinging Streamlit health endpoint..."
          health_status="$(
            curl \
              --silent \
              --show-error \
              --max-time 60 \
              --retry 2 \
              --retry-delay 10 \
              --output /tmp/streamlit_health.txt \
              --write-out "%{http_code}" \
              "${HEALTH_URL}"
          )"
          echo "Health HTTP ${health_status}"

          if [[ "${health_status}" -lt 200 || "${health_status}" -ge 400 ]]; then
            echo "Health request failed."
            exit 1
          fi

          echo "Pinging Streamlit app shell..."
          app_status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-time 60 \
              --retry 2 \
              --retry-delay 10 \
              --output /tmp/streamlit_app.html \
              --write-out "%{http_code}" \
              "${APP_URL}"
          )"
          echo "App shell HTTP ${app_status}"

          if [[ "${app_status}" -lt 200 || "${app_status}" -ge 400 ]]; then
            echo "App shell request failed."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser automation dependency
        run: npm install --no-save --no-package-lock playwright-core@1.60.0

      - name: Open Streamlit app in browser
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { chromium } = require("playwright-core");

          const appUrl = process.env.APP_URL;
          const readyText = process.env.READY_TEXT || "Credit Card Benefit Tracker";
          const chromeCandidates = [
            "/usr/bin/google-chrome",
            "/usr/bin/google-chrome-stable",
            "/usr/bin/chromium",
            "/usr/bin/chromium-browser",
          ];
          const executablePath = chromeCandidates.find((path) => fs.existsSync(path));

          if (!executablePath) {
            throw new Error("No Chrome or Chromium executable found on the runner.");
          }

          (async () => {
            const browser = await chromium.launch({
              executablePath,
              headless: true,
              args: ["--no-sandbox", "--disable-dev-shm-usage"],
            });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const start = Date.now();

            page.on("console", (message) => {
              if (message.type() === "error") {
                console.log(`browser console error: ${message.text()}`);
              }
            });

            await page.goto(appUrl, { waitUntil: "domcontentloaded", timeout: 120000 });
            await page.getByText(readyText, { exact: false }).first().waitFor({ timeout: 180000 });

            const elapsedSeconds = ((Date.now() - start) / 1000).toFixed(1);
            console.log(`Streamlit app rendered "${readyText}" in ${elapsedSeconds}s.`);
            await browser.close();
          })().catch(async (error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
