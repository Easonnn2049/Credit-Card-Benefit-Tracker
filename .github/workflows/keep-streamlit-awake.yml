name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      APP_URL: ${{ vars.STREAMLIT_APP_URL || secrets.STREAMLIT_APP_URL || secrets.ALERT_APP_URL }}

    steps:
      - name: Validate app URL
        shell: bash
        run: |
          APP_URL="${APP_URL//$'\r'/}"
          APP_URL="${APP_URL#\"}"
          APP_URL="${APP_URL%\"}"
          APP_URL="${APP_URL#\'}"
          APP_URL="${APP_URL%\'}"
          APP_URL="${APP_URL%/}"

          if [[ -z "${APP_URL}" ]]; then
            echo "Set repository variable STREAMLIT_APP_URL or secret STREAMLIT_APP_URL / ALERT_APP_URL to your Streamlit app URL."
            exit 1
          fi

          if [[ "${APP_URL}" != http://* && "${APP_URL}" != https://* ]]; then
            echo "APP_URL must start with http:// or https://."
            exit 1
          fi

          echo "APP_URL=${APP_URL}" >> "${GITHUB_ENV}"
          echo "HEALTH_URL=${APP_URL}/_stcore/health" >> "${GITHUB_ENV}"

      - name: Ping Streamlit app
        shell: bash
        run: |
          echo "Pinging Streamlit health endpoint..."
          status="$(
            curl \
              --location \
              --max-redirs 5 \
              --silent \
              --show-error \
              --max-time 60 \
              --retry 2 \
              --retry-delay 10 \
              --output /tmp/streamlit_health.txt \
              --write-out "%{http_code}" \
              "${HEALTH_URL}"
          )"
          echo "HTTP ${status}"

          if [[ "${status}" -lt 200 || "${status}" -ge 400 ]]; then
            echo "Keepalive request failed."
            exit 1
          fi
